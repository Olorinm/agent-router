name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm --prefix examples/echo-agent ci
      - run: npm --prefix examples/echo-agent run typecheck
      - run: npm --prefix examples/codex-employee ci
      - run: npm --prefix examples/codex-employee run typecheck
