name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - run: sh scripts/build-cli.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm --prefix examples/echo-agent ci
      - run: npm --prefix examples/echo-agent run typecheck
      - run: npm pack --dry-run

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - run: go vet ./...
      - run: go test -race ./...
      - run: sh scripts/build-cli.sh
      - name: Run the standalone CLI without a language runtime on PATH
        run: |
          PATH=/nonexistent ./bin/agent-router --version
          PATH=/nonexistent ./bin/agent-router --help
          PATH=/nonexistent ./bin/agent-router agent-guide
      - run: sh scripts/package-cli.sh
      - name: Verify Linux release archive
        run: |
          mkdir -p "$RUNNER_TEMP/agent-router-cli"
          tar -xzf state/release/agent-router_0.6.0_linux_amd64.tar.gz -C "$RUNNER_TEMP/agent-router-cli"
          PATH=/nonexistent "$RUNNER_TEMP/agent-router-cli/agent-router" --version
          (cd state/release && shasum -a 256 -c SHA256SUMS)
