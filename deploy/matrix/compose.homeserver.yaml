name: agent-router-matrix-homeserver
services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD_FILE: /run/secrets/password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ../../state/matrix-homeserver/postgres:/var/lib/postgresql/data
      - ../../state/matrix-homeserver/secrets/postgres:/run/secrets/password:ro
    networks: [database]
    mem_limit: 384m
    healthcheck: { test: [CMD-SHELL, "pg_isready -U synapse"], interval: 5s, timeout: 5s, retries: 20 }
  synapse:
    image: ghcr.io/element-hq/synapse:v1.160.0
    restart: unless-stopped
    volumes: [../../state/matrix-homeserver/synapse:/data]
    depends_on: { postgres: { condition: service_healthy } }
    networks: { database: {}, edge: { aliases: [matrix-homeserver] } }
    mem_limit: 1024m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
  admin:
    image: agent-router-matrix:lab
    profiles: [tools]
    user: root
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    environment: { MATRIX_HOMESERVER_STATE: /state, MATRIX_ADMIN_URL: "http://matrix-homeserver:8008" }
    volumes:
      - ../../state/matrix-homeserver:/state
      - ../../scripts/matrix:/app/scripts/matrix:ro
    entrypoint: [node, scripts/matrix/homeserver-admin.mjs]
networks:
  database:
    internal: true
  edge:
    external: true
    name: ${MATRIX_EDGE_NETWORK:-agent-router-edge}
