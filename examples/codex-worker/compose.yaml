name: agent-router-codex-experience
x-common: &common
  restart: unless-stopped
  stop_grace_period: 30s
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=128m,mode=1777"]
  pids_limit: 256
services:
  connector:
    <<: *common
    image: ${ROUTER_IMAGE:?Set ROUTER_IMAGE}
    command: [node, dist/matrix/index.js]
    environment:
      MATRIX_PROFILE: receiver
      MATRIX_CONFIG_DIR: /profiles
    volumes:
      - ./state/profiles:/profiles
    networks: [service, codex-egress]
    mem_limit: 512m
  worker:
    <<: *common
    image: agent-router-codex-worker:experience
    build:
      context: .
      args:
        ROUTER_IMAGE: ${ROUTER_IMAGE}
        CODEX_IMAGE: ${CODEX_IMAGE:?Set CODEX_IMAGE}
    environment:
      CONNECTOR_URL: http://127.0.0.1:8787
      CONNECTOR_API_TOKEN_FILE: /secrets/gateway
      CODEX_HOME: /codex-home
      CODEX_CONTAINER_ISOLATION: '1'
      CODEX_TIMEOUT_MS: ${CODEX_TIMEOUT_MS:-1800000}
      WORKER_STATE_DIR: /state
      WORKER_WORKSPACE_DIR: /workspaces
      WORKER_PROJECTS_DIR: /projects
      WORKER_NAME: codex-experience
      HTTP_PROXY: ${CODEX_PROXY_URL:-}
      HTTPS_PROXY: ${CODEX_PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - ./state/worker:/state
      - ./state/codex:/codex-home
      - ./state/workspaces:/workspaces
      - ./state/projects:/projects
      - ./secrets/gateway:/secrets/gateway:ro
    # Share the connector's loopback network without sharing its credential volume.
    network_mode: service:connector
    mem_limit: 2048m
    depends_on: [connector]
    healthcheck:
      test: [CMD, node, -e, "process.exit(Date.now()-Number(require('fs').readFileSync('/state/heartbeat','utf8')) < 45000 ? 0 : 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
networks:
  service: {}
  codex-egress:
    external: true
    name: ${CODEX_PROXY_NETWORK:?Set the existing egress network}
