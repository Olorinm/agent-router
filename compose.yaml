name: agent-router-matrix
services:
  agent-service:
    image: agent-router-matrix:managed
    build: { context: ., dockerfile: Dockerfile }
    command: [node, dist/matrix/service.js]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      HOST: 0.0.0.0
      PORT: '8790'
      # Only operator-controlled containers can reach this unpublished port.
      AGENT_TRUST_PROXY: uniquelocal
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:?required}
      MATRIX_HOMESERVER_URL: http://matrix-homeserver:8008
      AGENT_SERVICE_URL: https://${MATRIX_SERVER_NAME}/_agent-router/v1
      AGENT_SERVICE_STATE: /state
      MATRIX_AS_TOKEN_FILE: /secrets/as-token
      MATRIX_HS_TOKEN_FILE: /secrets/hs-token
    volumes:
      - ./state/agent-service:/state
      - ./state/agent-service-secrets:/secrets:ro
    networks: [edge]
    mem_limit: 768m
    pids_limit: 128
    depends_on: { synapse: { condition: service_healthy } }
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD_FILE: /run/secrets/password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ./state/matrix-homeserver/postgres:/var/lib/postgresql/data
      - ./state/matrix-homeserver/secrets/postgres:/run/secrets/password:ro
    networks: [database]
    mem_limit: 384m
    healthcheck: { test: [CMD-SHELL, "pg_isready -U synapse"], interval: 5s, timeout: 5s, retries: 20 }
  synapse:
    image: ghcr.io/element-hq/synapse:v1.160.0
    restart: unless-stopped
    volumes: [./state/matrix-homeserver/synapse:/data]
    depends_on: { postgres: { condition: service_healthy } }
    networks: { database: {}, edge: { aliases: [matrix-homeserver] } }
    mem_limit: 1024m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
  admin:
    image: agent-router-matrix:lab
    build: { context: ., dockerfile: Dockerfile }
    profiles: [tools]
    user: root
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    environment: { MATRIX_HOMESERVER_STATE: /state, MATRIX_ADMIN_URL: "http://matrix-homeserver:8008" }
    volumes:
      - ./state/matrix-homeserver:/state
      - ./scripts/matrix:/app/scripts/matrix:ro
    entrypoint: [node, scripts/matrix/homeserver-admin.mjs]
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment: { MATRIX_SERVER_NAME: "${MATRIX_SERVER_NAME:?required}" }
    ports: ["443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: { synapse: { condition: service_healthy } }
networks:
  database:
    internal: true
  edge:
    name: ${MATRIX_EDGE_NETWORK:-agent-router-edge}
volumes:
  caddy_data:
    name: agent-router-caddy-data
  caddy_config:
    name: agent-router-caddy-config
